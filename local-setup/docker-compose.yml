version: '3.1'

services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: paymaster
      POSTGRES_USER: arkauser
      POSTGRES_DB: arkadev
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - ./data/postgres:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql